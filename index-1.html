<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kumar Satyam | Junior SOC Analyst and Penetration Testing</title>
<meta name="description" content="Interactive terminal portfolio of Kumar Satyam, a BCA graduate from Delhi training as a SOC analyst and penetration tester.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#090e13;--panel:#0d151c;--ink:#c8d6e0;--dim:#6f8394;--green:#5ef2a0;--amber:#ffc857;--blue:#7db4ff;--line:#1c2a35;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 .95rem/1.6 var(--mono);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bar{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);font-size:.8rem;color:var(--dim)}
.bar i{width:10px;height:10px;border-radius:50%;background:#2b3b48}
.bar span{margin-left:.5rem}
#term{flex:1;overflow-y:auto;padding:1rem 1rem .5rem;max-width:56rem;width:100%;margin:0 auto}
.ln{white-space:pre-wrap;word-break:break-word;margin:0 0 .15rem}
.ln.gap{margin-bottom:.9rem}
.p{color:var(--green)}.h{color:var(--amber);font-weight:600}.d{color:var(--dim)}.ok{color:var(--green)}.k{color:var(--blue)}
.row{display:flex;gap:.6rem;align-items:center;padding:.4rem 1rem;max-width:56rem;width:100%;margin:0 auto}
.row label{color:var(--green);white-space:nowrap}
#cmd{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;caret-color:var(--green);padding:.3rem 0}
#cmd::placeholder{color:#3d4f5d}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:.6rem 1rem 1rem;max-width:56rem;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.chips button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:.45rem .8rem;font:500 .85rem var(--mono);cursor:pointer}
.chips button:hover,.chips button:active{border-color:var(--green);color:var(--green)}
.chips .hire{border-color:var(--amber);color:var(--amber)}
noscript{display:block;padding:1.5rem;max-width:40rem;margin:0 auto;color:var(--ink)}
</style>
</head>
<body>
<div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>visitor@kumar-satyam: ~</span></div>
<main id="term" role="log" aria-live="polite" aria-label="Terminal output" tabindex="-1"></main>
<form class="row" id="f" autocomplete="off">
  <label for="cmd">visitor@kumar:~$</label>
  <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="type help" aria-label="Type a command and press Enter">
</form>
<nav class="chips" aria-label="Quick commands">
  <button type="button" data-c="help">help</button>
  <button type="button" data-c="whoami">whoami</button>
  <button type="button" data-c="skills">skills</button>
  <button type="button" data-c="projects">projects</button>
  <button type="button" data-c="learning">learning</button>
  <button type="button" data-c="contact">contact</button>
  <button type="button" data-c="sudo hire kumar" class="hire">sudo hire kumar</button>
</nav>
<noscript>
  <h1>Kumar Satyam</h1>
  <p>Junior SOC analyst and penetration tester in training. BCA, Maharshi Dayanand University (2026). Delhi, India.</p>
  <p>Skills: Kali Linux, Nmap, Metasploit, Wireshark, Splunk, Python. Projects: Python antivirus simulation, home security lab, Raspberry Pi 4 cyberdeck.</p>
  <p>Email: <a href="mailto:kts441315@gmail.com">kts441315@gmail.com</a> | <a href="https://github.com/KumarSatyam36">GitHub</a> | <a href="https://www.linkedin.com/in/kumar-satyam-322b43198">LinkedIn</a></p>
</noscript>
<script>
(function(){
  var term=document.getElementById('term'),input=document.getElementById('cmd'),form=document.getElementById('f');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touch='ontouchstart' in window;
  var history=[],hi=0;
  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function line(html,cls){var d=document.createElement('div');d.className='ln'+(cls?' '+cls:'');d.innerHTML=html;term.appendChild(d);term.scrollTop=term.scrollHeight;return d;}
  function A(u,t){return '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>';}
  var C={
    help:function(){return [
      '<span class="h">Commands</span>',
      '  <span class="k">whoami</span>      who I am',
      '  <span class="k">skills</span>      tools I use',
      '  <span class="k">projects</span>    what I have built',
      '  <span class="k">learning</span>    what I am working on now',
      '  <span class="k">education</span>   my degree',
      '  <span class="k">contact</span>     how to reach me',
      '  <span class="k">nmap</span>        scan me',
      '  <span class="k">clear</span>       clear the screen',
      '<span class="d">Tip: press Tab to complete, Up arrow for history.</span>'];},
    whoami:function(){return [
      '<span class="h">Kumar Satyam</span>',
      'Junior SOC analyst and penetration tester in training.',
      'Delhi, India. Self-taught, with my own Kali Linux lab.',
      'I look for attacks in logs and weaknesses in systems.',
      '<span class="d">Open to entry-level SOC and security roles in Delhi NCR.</span>'];},
    skills:function(){return [
      '<span class="h">Monitor and investigate</span>  Splunk log search, alert triage, LetsDefend labs',
      '<span class="h">Test and exploit</span>         Kali Linux, Nmap, Metasploit, TCP/IP',
      '<span class="h">Analyse traffic</span>          Wireshark packet analysis',
      '<span class="h">Build tools</span>              Python, Linux command line, Git and GitHub'];},
    projects:function(){return [
      '<span class="h">1. Python antivirus simulation</span>  <span class="d">(Python)</span>',
      '   Scans files, flags suspicious ones with hash and signature detection,',
      '   quarantines them and logs every detection. '+A('https://github.com/KumarSatyam36','Code on GitHub'),
      '<span class="h">2. Home security lab</span>  <span class="d">(Kali, Nmap, Metasploit, Wireshark, Splunk)</span>',
      '   Practise recon, exploitation, packet capture and log analysis.',
      '<span class="h">3. Raspberry Pi 4 cyberdeck</span>  <span class="d">(Raspberry Pi 4, Linux)</span>',
      '   A portable cyberdeck I am building for security tooling.'];},
    learning:function(){return [
      '<span class="h">Learning right now</span>',
      '  TryHackMe and LetsDefend    hands-on rooms and labs',
      '  Splunk Core certification   preparing',
      '  CompTIA Security+           target December 2026'];},
    education:function(){return ['<span class="h">BCA</span>  Maharshi Dayanand University (MDU), 2022 to 2026'];},
    contact:function(){return [
      '<span class="h">Email</span>     '+A('mailto:kts441315@gmail.com','kts441315@gmail.com'),
      '<span class="h">LinkedIn</span>  '+A('https://www.linkedin.com/in/kumar-satyam-322b43198','linkedin.com/in/kumar-satyam-322b43198'),
      '<span class="h">GitHub</span>    '+A('https://github.com/KumarSatyam36','github.com/KumarSatyam36')];},
    nmap:function(){return [
      '<span class="d">Starting scan of kumar-satyam (Delhi, IN)</span>',
      'PORT          STATE      SERVICE',
      'kali-linux    <span class="ok">open</span>       recon, exploitation',
      'splunk        <span class="ok">open</span>       log search',
      'wireshark     <span class="ok">open</span>       packet analysis',
      'python        <span class="ok">open</span>       security tools',
      'security+     <span class="d">filtered</span>   target Dec 2026',
      '<span class="d">Scan complete: 1 candidate ready for a junior SOC role.</span>'];},
    ls:function(){return ['whoami  skills  projects  learning  education  contact  nmap'];},
    'sudo hire kumar':function(){return [
      '<span class="ok">[sudo] permission granted.</span>',
      'Great choice. Email '+A('mailto:kts441315@gmail.com','kts441315@gmail.com')+' and I will reply fast.'];}
  };
  var names=Object.keys(C).concat(['clear']);
  function run(raw){
    var cmd=raw.trim().toLowerCase().replace(/\s+/g,' ');
    line('<span class="p">visitor@kumar:~$</span> '+esc(raw));
    if(!cmd)return;
    history.push(raw);hi=history.length;
    if(cmd==='clear'){term.innerHTML='';return;}
    if(cmd==='hire')cmd='sudo hire kumar';
    if(cmd.indexOf('sudo')===0&&cmd!=='sudo hire kumar'){line('<span class="d">Nice try. Only one sudo command works here. Type help.</span>','gap');return;}
    var fn=C[cmd];
    if(!fn){line('command not found: '+esc(cmd)+'. Type <span class="k">help</span>.','gap');return;}
    var rows=fn();
    rows.forEach(function(r,i){line(r,i===rows.length-1?'gap':'');});
  }
  form.addEventListener('submit',function(e){e.preventDefault();var v=input.value;input.value='';run(v);});
  input.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'){if(history.length){hi=Math.max(0,hi-1);input.value=history[hi]||'';e.preventDefault();}}
    else if(e.key==='ArrowDown'){if(history.length){hi=Math.min(history.length,hi+1);input.value=history[hi]||'';e.preventDefault();}}
    else if(e.key==='Tab'){e.preventDefault();var v=input.value.toLowerCase();if(!v)return;var m=names.filter(function(n){return n.indexOf(v)===0;});if(m.length===1)input.value=m[0];}
  });
  document.querySelectorAll('.chips button').forEach(function(b){b.addEventListener('click',function(){run(b.getAttribute('data-c'));});});
  term.addEventListener('click',function(e){if(!window.getSelection().toString()&&e.target.tagName!=='A'&&!touch)input.focus();});
  var boot=['<span class="d">Booting kumar-satyam.sh ...</span>','<span class="d">Loading profile ...</span> <span class="ok">ok</span>','<span class="d">Loading projects ...</span> <span class="ok">ok</span>',' ','<span class="h">Kumar Satyam</span>  Junior SOC Analyst | Penetration Testing','Welcome. Type <span class="k">help</span> or tap a command below.',' '];
  function show(i){if(i>=boot.length){if(!touch)input.focus();return;}line(boot[i]);setTimeout(function(){show(i+1);},reduce?0:380);}
  show(0);
})();
</script>
</body>
</html>
